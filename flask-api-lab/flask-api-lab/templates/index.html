<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>狗狗圖片探索站</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f5f2;color:#17372c;font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.7}
    main{max-width:780px;margin:6vh auto;padding:30px}h1{font-size:clamp(28px,5vw,42px);line-height:1.3;margin:12px 0}
    .eyebrow{font-size:13px;letter-spacing:.12em}button{border:0;border-radius:10px;background:#176b50;color:#fff;padding:13px 26px;font:inherit;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #ba7400;outline-offset:4px}
    figure{margin:24px 0;background:white;border-radius:16px;padding:18px;min-height:140px}img{display:block;max-width:100%;max-height:560px;margin:auto;border-radius:8px}
    #status{min-height:2em}a{color:#176b50}footer{font-size:14px;color:#4c635a}code{background:#e1eae4;padding:2px 5px} [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <div class="eyebrow">FLASK × PUBLIC API</div>
  <h1>狗狗圖片探索站</h1>
  <p>按一下，透過 Flask 後端取得一張隨機狗狗圖片。</p>
  <button id="load" type="button">換一張狗狗圖片</button>
  <p id="status" role="status" aria-live="polite">準備好了，按下按鈕開始探索。</p>
  <figure aria-busy="false" id="gallery">
    <img id="photo" alt="Dog CEO 提供的隨機狗狗照片" hidden>
    <figcaption id="caption">圖片將顯示在這裡。</figcaption>
  </figure>
  <footer>
    <p>資料與圖片來源：<a href="https://dog.ceo/dog-api/">Dog CEO API</a>。
    本站為 API 串接課程練習，使用前請閱讀來源的相關條件。</p>
    <p>資料流：瀏覽器 → <code>/api/dog</code> → Flask → Dog CEO。</p>
  </footer>
</main>
<script>
const button = document.querySelector('#load');
const statusText = document.querySelector('#status');
const photo = document.querySelector('#photo');
const caption = document.querySelector('#caption');
const gallery = document.querySelector('#gallery');

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => finish(new Error('圖片下載逾時，請再試一次。')), 15000);
    function finish(error) {
      clearTimeout(timer);
      photo.onload = null;
      photo.onerror = null;
      if (error) { photo.removeAttribute('src'); reject(error); }
      else resolve();
    }
    photo.onload = () => finish();
    photo.onerror = () => finish(new Error('圖片無法載入，請再換一張。'));
    photo.src = url;
  });
}

button.addEventListener('click', async () => {
  button.disabled = true;
  gallery.setAttribute('aria-busy', 'true');
  statusText.textContent = '正在取得圖片，請稍候…';
  photo.hidden = true;
  caption.textContent = '正在載入…';
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch('/api/dog', {signal: controller.signal});
    const data = await response.json();
    if (!response.ok || data.ok !== true) {
      throw new Error(typeof data.error === 'string' ? data.error : '目前無法取得圖片。');
    }
    const url = new URL(data.image_url);
    if (url.protocol !== 'https:' || url.hostname !== 'images.dog.ceo' || url.port || url.username || url.password) {
      throw new Error('圖片網址格式不符合預期。');
    }
    clearTimeout(timer);
    await loadImage(url.href);
    photo.hidden = false;
    caption.textContent = '圖片來源：Dog CEO';
    statusText.textContent = '載入成功！可以再換一張。';
  } catch (error) {
    statusText.textContent = error.name === 'AbortError'
      ? '等候回應逾時，請稍後再試。'
      : (error instanceof SyntaxError ? '回應格式異常，請稍後再試。' : error.message);
    caption.textContent = '目前沒有可顯示的圖片。';
  } finally {
    clearTimeout(timer);
    button.disabled = false;
    gallery.setAttribute('aria-busy', 'false');
  }
});
</script>
</body>
</html>
